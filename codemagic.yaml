workflows:
  flutter-connect-ios:
    name: Flutter iOS Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - cd grocery_shop_app  # Chuyển vào thư mục app Flutter
      - flutter pub get      # Cài dependencies
      - flutter build ios --debug --no-codesign  # Build debug cho iOS (không cần signing cho Connect)
    artifacts:
      - build/ios/iphoneos/*.app  # Lưu .app cho device
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app