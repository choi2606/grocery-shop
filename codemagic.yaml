workflows:
  ios-debug-connect:
    name: Flutter iOS Debug for Codemagic Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Build iOS Debug (for real device testing)
        script: |
          cd grocery_shop_app
          flutter clean
          flutter pub get
          flutter build ios --debug --no-codesign --simulator=no
    artifacts:
      - build/ios/iphoneos/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
    publishing:
      # Không cần publish gì cả, chỉ để kích hoạt Devices tab
      scripts:
        - echo "Build completed – Devices tab now enabled"