workflows:
  ios-debug-connect:
    name: Flutter iOS Debug for Codemagic Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean and prepare iOS
        script: |
          cd grocery_shop_app
          flutter clean
          flutter pub get

          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/' Podfile
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Build iOS Debug (for real device)
        script: |
          cd grocery_shop_app
          flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    publishing:
      scripts:
        - echo "Build completed – Devices tab now enabled"
